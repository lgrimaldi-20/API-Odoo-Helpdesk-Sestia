# Orquestacion del middleware de exportacion de Helpdesk.
#
#   web -> API FastAPI (uvicorn) en el puerto 8000
#
# La exportacion es sincrona y de solo lectura: no necesita cola de tareas ni
# base de datos propia, asi que no hay worker ni broker que levantar.
#
# Uso:
#   docker compose up --build
#
# Las credenciales de Odoo y la API_KEY se toman de .env (env_file).
services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
